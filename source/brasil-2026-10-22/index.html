<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: quando o teclado abre, o navegador
         REDIMENSIONA o layout em vez de deslocar a viewport por cima dele. Sem
         isso, um elemento `fixed` (o chat) é arrastado pra cima junto e volta ao
         lugar um ou dois frames depois, quando o JS compensa — o tranco que dava
         ao focar o campo de digitar. Com isto, não há o que compensar.
         Chrome/Android entende; iOS ainda não, e lá o ajuste por
         visualViewport (ChatScreen.tsx) continua sendo a rede. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Quiz - Crie sua Personagem</title>
    <!-- Arte da primeira tela: baixa em paralelo com o JS, em vez de esperar o
         React montar. É a primeira coisa que o lead vê — cada 100ms conta.
         Como existe uma versão por idioma, a escolha acontece aqui. Isto é só
         uma dica de download: se errar, a imagem certa carrega normalmente
         logo depois (o geo-IP, que é assíncrono, ainda não respondeu aqui). -->
    <script>
      (function () {
        var en = false;
        try {
          var p = new URLSearchParams(location.search);
          var l = (p.get('lang') || '').toLowerCase();
          var r = p.get('region');
          if (l || r) {
            en = l === 'en' || r === 'intl';
          } else {
            var s = JSON.parse(localStorage.getItem('nq_region') || 'null');
            if (s && Date.now() - s.ts < 21600000) en = s.r === 'intl';
            else en = !/^(pt|es)/i.test(navigator.language || '');
          }
        } catch (e) { /* na dúvida, português */ }
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = en ? '/inicioEN.webp' : '/inicio.webp';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pixel da Utmify — UM carregamento só, de propósito.

         Aqui havia três <script> carregando o MESMO cdn.utmify.com.br/pixel.js:
         o de window.pixelIds, o snippet ofuscado do painel (que decodifica
         exatamente para url + pixelId = 6a7d0a60b22fd4bcfa49fa36) e este. As
         três cópias corriam juntas e cada carregamento jogava três erros não
         tratados no console ("Cannot read properties of undefined (reading
         '_id')"), porque uma instância lia o lead que a outra ainda não tinha
         montado.

         Apagar as duas primeiras não muda NADA no que é reportado: o pixel.js
         lê window.pixelId, uma STRING ÚNICA, num getter preguiçoso consultado
         depois do await do geo-IP. Ou seja, valia o id definido por último —
         este — e os outros dois já não reportavam nada. O window.pixelIds
         nunca foi lido por ninguém.

         Rodar dois pixels de verdade continua exigindo agregar os pixels do
         Meta numa única conta Utmify, pelo painel deles. -->
    <script>
      window.pixelId = "6a84dcf393078ddddd089ee0";
      var utmifyPixel = document.createElement("script");
      utmifyPixel.src = "https://cdn.utmify.com.br/scripts/pixel/pixel.js";
      utmifyPixel.async = true;
      utmifyPixel.defer = true;
      (document.head || document.documentElement).appendChild(utmifyPixel);
    </script>

      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1481680676270423');
      fbq('init', '1476002634159977');
      fbq('init', '1480631143425725');
      fbq('init', '996243830044109');

    <!-- Pixel de navegador do cliutm (trackio). NÃO REMOVER — decisão do dono
         do projeto (14/10/2026). Saiu uma vez, em 01/09, por engano, e um teste
         (tests/tracking.test.mjs) agora falha se ele sumir.


         Saiu em 01/09 porque o host servia um stub vazio. Hoje o pixel.js é um
         script de verdade: carrega o fbevents, faz fbq('init') em cada id de
         pixel_ids (1094098306749232 e 1481680676270423) e, AO CARREGAR,
         dispara sozinho um PageView (fbq + cópia server-side pro cliutm, com
         event_id próprio).

         Por isso ele é o ÚNICO dono do PageView: o trackEvent('PageView') que
         ficava em src/main.tsx saiu no mesmo commit. Com os dois, o PageView
         contava dobrado — e em TODOS os pixels, porque fbq('track') vai pra
         todos os inicializados. Os demais eventos seguem pelo nosso código
         (src/utils/utm.ts), que já manda o mesmo event_id pro navegador e pro
         cliutm. -->
    <script async src="https://trackio-performance.mageboss.chatgpt.site/pixel.js?pixel_ids=1094098306749232,1481680676270423"></script>

    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>

    <!-- Anti-inspecionar: bloqueia atalhos comuns do DevTools/ver-código e
         redireciona se as ferramentas forem abertas mesmo assim. Desligado em
         localhost pra não atrapalhar o dev. Não roda o bloqueio de desktop
         que existia aqui antes (isMobile) — isso barraria todo mundo no PC,
         não só quem abre o inspecionar; ficou de fora de propósito. -->
    <script>
      (function () {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;

        var URL_REDIRECT = "https://www.cnnbrasil.com.br/lifestyle/1-em-cada-10-brasileiros-usa-chat-de-ia-como-amigo-ou-conselheiro/";
        var saiu = false;
        function sair() {
          if (saiu) return;
          saiu = true;
          window.location.replace(URL_REDIRECT);
        }

        // Atalhos que abrem o DevTools ou o código-fonte
        document.addEventListener('keydown', function (e) {
          var k = e.key;
          var combo =
            k === 'F12' ||
            (e.ctrlKey && e.shiftKey && /^[ijc]$/i.test(k)) ||
            (e.metaKey && e.altKey && /^[ijc]$/i.test(k)) ||
            ((e.ctrlKey || e.metaKey) && /^u$/i.test(k));
          if (combo) { e.preventDefault(); e.stopPropagation(); }
        }, true);

        // Menu do botão direito — é por ali que se chega no "Inspecionar"
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

        // DevTools aberto (na entrada ou depois): o "debugger" só pausa a
        // execução quando o painel está aberto — o atraso denuncia.
        setInterval(function () {
          var inicio = Date.now();
          // eslint-disable-next-line no-debugger
          debugger;
          if (Date.now() - inicio > 100) sair();
        }, 1000);
      })();
    </script>
